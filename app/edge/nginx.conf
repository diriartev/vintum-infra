pid /tmp/nginx.pid;

events {}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    gzip on;

    # IP real del visitante (Bloque 2): el tráfico llega desde el contenedor
    # cloudflared, así que $remote_addr sería siempre su IP interna. Solo se
    # confía en CF-Connecting-IP cuando la petición viene de la red Docker de
    # Vintum (donde vive cloudflared); desde cualquier otro origen la cabecera
    # se ignora, así que no se puede falsear. Afecta a los logs (Filebeat ->
    # Elasticsearch) y a X-Real-IP hacia la API (rate-limit por IP real).
    set_real_ip_from 172.20.0.0/16;
    real_ip_header   CF-Connecting-IP;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Cabeceras de seguridad para el HTML/estáticos servidos directo por
    # nginx (las respuestas de /api/* ya las trae Fastify/@fastify/helmet,
    # esto cubre lo que nginx sirve sin pasar por el backend).
    map $sent_http_content_type $csp_header {
        default "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https:; object-src 'none'; frame-ancestors 'none'; base-uri 'none'";
    }

    # Cache por tipo de recurso, centralizado acá a propósito: un
    # add_header dentro de un location "tapa" los add_header del server{}
    # que lo contiene (comportamiento de nginx), así que en vez de repetir
    # las cabeceras de seguridad en cada location, la única cabecera que
    # varía por ruta (Cache-Control) se resuelve con este map y se agrega
    # una sola vez a nivel server.
    map $uri $cache_control_value {
        ~^/assets/    "public, max-age=31536000, immutable";
        ~^/avatars/   "public, max-age=31536000, immutable";
        default       "no-cache";
    }

    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;

        # Los avatares suben hasta MAX_UPLOAD_BYTES (8MB) + overhead de
        # multipart -- el default de nginx (1MB) los cortaría antes de que
        # lleguen al backend.
        client_max_body_size 10m;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Content-Security-Policy $csp_header always;
        add_header Cache-Control $cache_control_value always;

        location /assets/ {
            try_files $uri =404;
        }

        # index.html y el resto del shell de la SPA: nunca cacheado (ver
        # map de más arriba), así un deploy nuevo se ve al instante (evita
        # servir un bundle viejo desde una caché intermedia -- misma
        # lógica anti cache-poisoning que ya aplica el backend a /api/*).
        location / {
            try_files $uri /index.html;
        }

        location /api/ {
            # El server{} de acá arriba ya agrega su propio set completo de
            # cabeceras de seguridad -- sin esto, la respuesta de Fastify
            # (que trae las suyas via helmet) terminaba duplicando
            # Content-Security-Policy/X-Frame-Options/Referrer-Policy.
            proxy_hide_header Content-Security-Policy;
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Referrer-Policy;
            proxy_hide_header X-Content-Type-Options;

            proxy_pass http://api:3000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # OJO: no usar $proxy_add_x_forwarded_for -- eso APPENDEA al
            # X-Forwarded-For que haya llegado, y si alguna vez algo en el
            # camino reenvía un XFF que el visitante pudo setear a mano, un
            # atacante podría falsear la IP que ve el rate-limit/anti
            # fuerza-bruta. Cf-Connecting-Ip es la que pone Cloudflare en su
            # borde a partir de la conexión TCP real -- el cliente no la
            # puede spoofear.
            proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
            proxy_set_header Cf-Connecting-Ip $http_cf_connecting_ip;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Nunca dejar que un 5xx del backend
            # filtre detalle interno (stack trace, IP, ruta) al visitante.
            proxy_intercept_errors on;
            error_page 500 502 503 504 =503 /50x-generic.html;
        }

        location /avatars/ {
            proxy_hide_header Content-Security-Policy;
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Referrer-Policy;
            proxy_hide_header X-Content-Type-Options;

            proxy_pass http://api:3000/avatars/;
            proxy_set_header Host $host;
            proxy_intercept_errors on;
            error_page 500 502 503 504 =503 /50x-generic.html;
        }

        location = /50x-generic.html {
            root /usr/share/nginx/html;
            internal;
        }
    }
}
