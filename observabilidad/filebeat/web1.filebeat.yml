# Filebeat 9.5.4 — web1 (sitio1, rol: web) — Vintum Bloque 2
# Envía a Elasticsearch (elastic-01, sitio 2) por TLS verificando la CA propia,
# autenticado con una API key de solo escritura guardada en el keystore (${ES_API_KEY}).
filebeat.config.modules:
  path: ${path.config}/modules.d/*.yml
  reload.enabled: false

filebeat.inputs:
  # nginx de Vintum: stdout del contenedor = access log, stderr = error log
  - type: filestream
    id: vintum-nginx-access
    paths: ["/var/lib/docker/containers/*/*.log"]
    parsers:
      - container: {stream: stdout, format: docker}
    processors:
      - add_docker_metadata: ~
      - drop_event.when.not.equals.container.name: vintum_app
      - add_fields: {target: event, fields: {module: nginx, dataset: nginx.access}}
    pipeline: filebeat-9.5.4-nginx-access-pipeline

  - type: filestream
    id: vintum-nginx-error
    paths: ["/var/lib/docker/containers/*/*.log"]
    parsers:
      - container: {stream: stderr, format: docker}
    processors:
      - add_docker_metadata: ~
      - drop_event.when.not.equals.container.name: vintum_app
      - add_fields: {target: event, fields: {module: nginx, dataset: nginx.error}}
    pipeline: filebeat-9.5.4-nginx-error-pipeline

  # Resto de contenedores (API, Wiki, GLPI, Homarr, cloudflared, Portainer...) en crudo
  - type: filestream
    id: docker-contenedores
    paths: ["/var/lib/docker/containers/*/*.log"]
    parsers:
      - container: {stream: all, format: docker}
    processors:
      - add_docker_metadata: ~
      - drop_event.when.equals.container.name: vintum_app
      - add_fields: {target: event, fields: {module: docker, dataset: docker.container_logs}}

processors:
  - add_host_metadata: ~
  # web1/web2 y db1/db2 son clones con el mismo hostname del SO: nombre unico para Kibana
  - add_fields:
      target: host
      fields: {name: web1}
  - add_fields:
      target: labels
      fields: {sitio: sitio1, rol: web, proyecto: vintum}

output.elasticsearch:
  hosts: ["https://10.20.1.40:9200"]
  api_key: "${ES_API_KEY}"
  ssl.certificate_authorities: ["/etc/filebeat/elastic-ca.crt"]
  ssl.verification_mode: full

# La plantilla, el ILM y los pipelines se cargaron una sola vez con el superusuario
# (filebeat setup); la API key de este host no tiene permisos para modificarlos.
setup.template.enabled: false
setup.ilm.enabled: false

logging.level: info
logging.to_files: true
logging.files: {path: /var/log/filebeat, name: filebeat, keepfiles: 5, permissions: "0640"}
