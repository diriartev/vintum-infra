version: '2'
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: wiki
      POSTGRES_PASSWORD: <REDACTADO>
      POSTGRES_USER: wikijs
    logging:
      driver: "none"
    restart: unless-stopped
    volumes:
      - db-data:/var/lib/postgresql/data

  wiki:
    image: requarks/wiki:2
    depends_on:
      - db
    environment:
      DB_TYPE: postgres
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: wikijs
      DB_PASS: <REDACTADO>
      DB_NAME: wiki
    restart: unless-stopped
    ports:
      - "10.20.0.50:3000:3000"  # solo LAN; Docker se salta ufw

volumes:
  db-data: