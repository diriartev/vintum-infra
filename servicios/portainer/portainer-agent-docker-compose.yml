# Portainer Agent — expone la API Docker de svc-01 al servidor Portainer (web1, 10.20.0.50:9443)
# Tiene el socket de Docker (= root del host): 9001 filtrado en DOCKER-USER, solo desde 10.20.0.50.
services:
  agent:
    image: portainer/agent:2.45.0            # misma versión que el servidor
    container_name: portainer_agent
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    ports:
      - "10.20.0.70:9001:9001"
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
